<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocFlow</title>
<meta name="description" content="Review invoices and receipts read by DocFlow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E4FD8'/%3E%3Cpath d='M9 7h6.5a9 9 0 0 1 0 18H9z' fill='white'/%3E%3Cpath d='M13 11v10h2.5a5 5 0 0 0 0-10z' fill='%231E4FD8'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <aside class="nav" aria-label="Main">
    <a class="brand" href="#/overview" aria-label="DocFlow home">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="var(--accent)"/><path d="M9 7h6.5a9 9 0 0 1 0 18H9z" fill="#fff"/><path d="M13 11v10h2.5a5 5 0 0 0 0-10z" fill="var(--accent)"/></svg>
      <span>DocFlow</span>
    </a>
    <nav>
      <a href="#/overview" data-route="overview"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v6H3zM11 3h6v4h-6zM11 9h6v8h-6zM3 11h6v6H3z"/></svg>Overview</a>
      <a href="#/review" data-route="review"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h9l3 3v11H4z M7 9h6M7 12h6M7 15h4"/></svg>Review queue<span class="count" id="nav-pending" hidden></span></a>
      <a href="#/documents" data-route="documents"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>Documents</a>
      <a href="#/benchmarks" data-route="benchmarks"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 16V9M8 16V4M12 16v-5M16 16V7"/></svg>Benchmarks</a>
      <a href="#/system" data-route="system"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>System</a>
    </nav>
    <div class="nav-foot">
      <div class="engine" id="engine" title="Model reading the documents"><span class="dot"></span><span id="engine-name">Connecting…</span></div>
      <button class="theme" id="theme" type="button" aria-label="Switch between light and dark">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z"/></svg>
      </button>
    </div>
  </aside>

  <div class="main-col">
    <header class="top">
      <button class="menu" id="menu" type="button" aria-label="Open menu"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
      <form class="search" id="search" role="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/></svg>
        <input id="search-input" type="search" placeholder="Search supplier, invoice number or file" aria-label="Search documents">
        <kbd>/</kbd>
      </form>
      <button class="btn primary" id="upload-btn" type="button">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 14V4M6 8l4-4 4 4M4 16h12"/></svg>Upload
      </button>
      <input type="file" id="file-input" multiple accept=".pdf,.xlsx,.csv,.txt,.jpg,.jpeg,.png" hidden>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<div class="drop-overlay" id="drop-overlay" hidden><div>Drop invoices or receipts to upload them</div></div>
<section class="uploads" id="uploads" aria-live="polite" hidden>
  <header><strong>Uploads</strong><button type="button" class="link" id="uploads-close">Close</button></header>
  <ol id="upload-list"></ol>
</section>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="/static/app.js"></script>
</body>
</html>
